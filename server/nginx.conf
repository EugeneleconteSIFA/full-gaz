# /etc/nginx/sites-available/correspondance.kernse.fr — jeu public.
# Page statique : /srv/correspondance/site ; classement : service correspondance-api (127.0.0.1:8160).
# HTTPS : lancer « certbot --nginx -d correspondance.kernse.fr » une fois, il ajoute les blocs SSL.
server {
    listen 80;
    listen [::]:80;
    server_name correspondance.kernse.fr;
    root /srv/correspondance/site;
    index correspondance.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html application/json;

    location = / { try_files /correspondance.html =404; expires -1; }
    location = /correspondance.html { expires -1; }
    location / { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8160;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }
}
