# /etc/nginx/sites-available/latraverse.kernse.fr — jeu public.
# Page statique : /srv/latraverse/site ; classement : service latraverse-api (127.0.0.1:8160).
# HTTPS : certificat Let's Encrypt géré par certbot (blocs « managed by Certbot » ci-dessous).
# Image de partage du jour : og/AAAA-MM-JJ.png (rendue à l'avance par tools/render_og.js).
# Le serveur est à l'heure de Paris, donc $time_iso8601 donne la date du puzzle.
map $time_iso8601 $latraverse_day {
    "~^(?<d>\d{4}-\d{2}-\d{2})" $d;
    default "";
}

server {
    server_name latraverse.kernse.fr;
    root /srv/latraverse/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json image/svg+xml;

    # La page annonce l'image du jour : une URL par jour, que les messageries ne confondent pas d'un jour à l'autre.
    location = / { try_files /index.html =404; expires -1; sub_filter_once on; sub_filter '/og.png"' '/og/$latraverse_day.png"'; }
    location = /index.html { expires -1; sub_filter_once on; sub_filter '/og.png"' '/og/$latraverse_day.png"'; }
    location /og/ { expires 1d; try_files $uri /og.png; }
    location ~ ^/(favicon\.svg|icon-180\.png|og\.png)$ { expires 7d; }
    location / { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8160;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/latraverse.kernse.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/latraverse.kernse.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = latraverse.kernse.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name latraverse.kernse.fr;
    return 404; # managed by Certbot


}