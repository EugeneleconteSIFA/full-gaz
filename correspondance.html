<style>
/* Mise en page : une colonne, le plan de Lille au centre, le tableau de bord en dessous. */
:root {
  --bg: #edf0f3;
  --panel: #ffffff;
  --paper: #ffffff;
  --ink: #121c27;
  --muted: #556473;
  --rule: #cdd5dd;

  --l5: #2b9a45;
  --l6: #1c7ed6;
  --l7: #7048e8;
  --l90: #c2255c;
  --l92: #8f5a1e;
  --street: #b4bfca;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --panel: #151f29; --paper: #0d141b; --ink: #e8eef3; --muted: #9aa8b5; --rule: #2a3845;
    --trace: #3bc9db; --warn: #ff922b; --m1: #ffd23f; --m2: #ff6b6b; --l1: #3bc9db; --l5: #51cf66; --l6: #4dabf7; --l7: #9775fa; --l90: #f783ac; --l92: #e0a96d; --street: #4b5b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --panel: #151f29; --paper: #0d141b; --ink: #e8eef3; --muted: #9aa8b5; --rule: #2a3845;
  --trace: #3bc9db; --warn: #ff922b; --m1: #ffd23f; --m2: #ff6b6b; --l1: #3bc9db; --l5: #51cf66; --l6: #4dabf7; --l7: #9775fa; --l90: #f783ac; --l92: #e0a96d; --street: #4b5b6b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 20px 48px;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--l6); outline-offset: 2px; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 44px; height: 44px; flex: none; }
.mark .m-line { fill: none; stroke: var(--m2); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.mark .m-st { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
h1 { margin: 0; font: 700 34px/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
.sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 14px; font-weight: 600; font-size: 14px; min-height: 40px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Consigne */
.brief { margin: 0; font-size: 19px; line-height: 1.55; text-wrap: pretty; }
.brief .badge {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--paper); font: 700 13px/1 var(--font-display); vertical-align: 1px; margin-right: 2px;
}
.brief strong { font-weight: 600; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.notice { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.notice.alert { border-color: var(--warn); }
.notice.alert .eyebrow { color: var(--warn); }
.notice p + p { margin: 0; font-size: 15px; font-weight: 500; }

/* Plan */
.board { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 6px; overflow-x: auto; }
#map { display: block; width: 100%; min-width: 700px; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#map .grid { fill: var(--rule); }
#map .band { stroke: var(--trace); stroke-width: 24; stroke-linecap: round; opacity: 0; transition: opacity .15s; }
#map .band.on { opacity: 1; }
#map .ln { fill: none; stroke-linecap: round; }
#map .ln.metro { stroke-width: 9; }
#map .ln.bus { stroke-width: 6; stroke-dasharray: 11 6; stroke-linecap: butt; }
#map .ln.rue { stroke-width: 5; stroke: var(--street); }
#map .ln.M1 { stroke: var(--m1); } #map .ln.M2 { stroke: var(--m2); }
#map .ln.L1 { stroke: var(--l1); } #map .ln.L5 { stroke: var(--l5); } #map .ln.L7 { stroke: var(--l7); }
#map .ln.L90 { stroke: var(--l90); } #map .ln.L92 { stroke: var(--l92); }
#map .ln.closed { stroke: var(--street); stroke-width: 4; stroke-dasharray: 2 9; stroke-linecap: round; opacity: .8; }
#map .optline { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0.1 11; opacity: 0; transition: opacity .3s; }
#map .optline.show { opacity: 1; }
#map .pill { pointer-events: none; }
#map .pill rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }
#map .pill.mod rect { stroke: var(--warn); stroke-width: 2.4; }
#map .pill text { font: 500 13px var(--font-data); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
#map .pill.on rect { fill: var(--ink); stroke: var(--ink); }
#map .pill.on text { fill: var(--paper); }
#map .pill.x circle { fill: var(--warn); }
#map .pill.x text { fill: #fff; font: 700 15px var(--font-body); }

#map .sta { cursor: pointer; outline: none; }
#map .sta .hit { fill: rgba(0,0,0,0); }
#map .sta .dot { fill: var(--paper); stroke: var(--ink); stroke-width: 3.5; transition: fill .15s; }
#map .sta.hub .dot { stroke-width: 5; }
#map .sta.visited .dot { fill: var(--trace); }
#map .sta.begin .dot, #map .sta.end .dot { fill: var(--ink); }
#map .sta .mk { font: 700 15px var(--font-display); fill: var(--paper); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#map .sta .ring { fill: none; stroke: var(--ink); stroke-width: 0; }
#map .sta.reach .ring { stroke-width: 2.5; stroke-dasharray: 4 5; animation: pulse 1.6s ease-in-out infinite; }
#map .sta.current .ring { stroke-width: 3.5; stroke-dasharray: none; animation: none; }
#map .sta:focus-visible .dot { stroke: var(--l6); stroke-width: 7; }
#map .nm { font: 500 13px var(--font-body); fill: var(--ink); dominant-baseline: central; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
#map .nm.key { font-weight: 700; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) {
  #map .sta.reach .ring { animation: none; }
  #map .band, #map .optline, #map .sta .dot { transition: none; }
}
.scrollhint { display: none; margin: 0; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .scrollhint { display: block; } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 24px; height: 0; border-top: 7px solid var(--street); border-radius: 4px; }
.legend i.m1 { border-color: var(--m1); } .legend i.m2 { border-color: var(--m2); }
.legend i.bus { border-top: 5px dashed var(--l5); border-radius: 0; }
.legend i.band { border-color: var(--trace); border-top-width: 9px; }
.legend i.dots { border-top: 5px dotted var(--ink); border-radius: 0; }
.legend .wait { flex-basis: 100%; }

/* Tableau de bord */
.hud { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.hud > div { padding: 10px 12px; min-width: 0; }
.hud > div + div { border-left: 1px solid var(--rule); }
.hud dt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hud dd { margin: 2px 0 0; font: 500 28px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.hud small { font: 500 14px var(--font-body); color: var(--muted); }

.route { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 34px; }
.route .stop { font-weight: 600; font-size: 15px; padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; }
.route .stop.first { background: var(--ink); color: var(--paper); }
.route .leg { font: 500 13px var(--font-data); padding: 2px 8px; border-radius: 6px; border: 2px solid var(--street); }
.route .leg.M1 { border-color: var(--m1); } .route .leg.M2 { border-color: var(--m2); }
.route .leg.L1 { border-color: var(--l1); } .route .leg.L5 { border-color: var(--l5); } .route .leg.L7 { border-color: var(--l7); }
.route .leg.L90 { border-color: var(--l90); } .route .leg.L92 { border-color: var(--l92); }
.route .wait { font-size: 13px; color: var(--muted); }
.route .empty { color: var(--muted); font-size: 15px; }
.choose { background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.choose p { margin: 0; font-weight: 600; }
.choose .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.choose .opts .btn { border-left-width: 8px; text-align: left; }
.status { margin: 0; min-height: 1.5em; font-size: 15px; font-weight: 500; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { background: transparent; border: 2px solid var(--ink); border-radius: 8px; padding: 10px 16px; min-height: 46px; font-weight: 600; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.primary { background: var(--trace); color: var(--on-trace); border-color: var(--on-trace); flex: 1 1 180px; font-size: 17px; }
.btn.primary:disabled { background: transparent; color: var(--ink); border-color: var(--ink); }

/* Résultat */
.result { background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.score strong { font: 700 68px/0.95 var(--font-display); letter-spacing: .01em; }
.score span { font: 600 28px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.result p { margin: 0; text-wrap: pretty; }
.lesson { padding-left: 12px; border-left: 4px solid var(--trace); }
.share pre {
  margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  font: 500 15px/1.6 var(--font-data); white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text;
}
.share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.copied { font-size: 14px; color: var(--muted); }

@media (max-width: 480px) {
  h1 { font-size: 26px; letter-spacing: .02em; }
  .mark { width: 38px; height: 38px; }
  .hud dd { font-size: 24px; }
  .score strong { font-size: 56px; }
}
</style>

<main>

/*GEN-START*/

    }
    $('status').textContent = msg;

    var ch = $('choose');
    ch.hidden = !S.choose || S.done;
    if (!ch.hidden) {
      var li = ev.steps.length ? ev.steps[ev.steps.length - 1].a.li : NONE;
      $('chooseQ').textContent = 'Vers ' + P.nodes[S.choose].name + ' : quelle ligne ?';
      var box = $('chooseOpts');
      box.textContent = '';
      links(cur, S.choose).forEach(function (a) {
        var b = document.createElement('button'), wait = a.li !== li ? P.board[a.mode] : 0;
        b.type = 'button'; b.className = 'btn';
        b.style.borderLeftColor = 'var(--' + (a.mode === 'rue' ? 'street' : LK[a.li].toLowerCase()) + ')';
        b.textContent = LNAME[LK[a.li]] + (P.edges[a.e].name ? ' · ' + P.edges[a.e].name : '') + ' · ' + a.w + ' min' + (wait ? ' + attente ' + wait : '');
        b.addEventListener('click', function () { go(S.choose, a.e); });
        box.appendChild(b);
      });
    }

    $('actions').hidden = S.done;
    $('undo').disabled = S.path.length < 2 && S.choose === null;
    $('reset').disabled = S.path.length < 2;
    $('validate').disabled = !atEnd;

    $('result').hidden = !S.done;
    if (S.done) showResult();
  }

  function flash(m) { S.msg = m; update(); clearTimeout(flash.t); flash.t = setTimeout(function () { S.msg = ''; update(); }, 2400); }

  function tap(id) {
    if (S.done) return;
    var P = S.P, cur = S.path[S.path.length - 1];
    if (id === cur) return;
    if (S.path.length > 1 && id === S.path[S.path.length - 2]) { undo(); return; }
    if (S.path.indexOf(id) >= 0) { flash('Station déjà empruntée. Utilise Annuler pour revenir en arrière.'); return; }
    if (cur === P.t) { flash('Tu es à l’arrivée. Valide, ou annule.'); return; }
    var opts = links(cur, id);
    if (!opts.length) {
      var closed = P.edges.some(function (e) { return e.closed && ((e.a === cur && e.b === id) || (e.a === id && e.b === cur)); });
      flash(closed ? 'Cette liaison est fermée aujourd’hui.' : 'Pas de liaison directe avec cette station.');
      return;
    }
    if (opts.length > 1) { S.msg = ''; S.choose = id; update(); return; }
    go(id, opts[0].e);
  }
  function go(id, e) {
    S.msg = ''; S.choose = null;
    S.path.push(id); S.via.push(e);
    if (!S.t0) S.t0 = Date.now();
    startTimer();
    update();
  }
  function undo() {
    if (S.done) return;
    if (S.choose !== null) { S.choose = null; update(); return; }
    if (S.path.length < 2) return;
    S.path.pop(); S.via.pop(); S.msg = ''; update();
  }
  function reset() { if (S.done) return; S.path = [S.P.s]; S.via = []; S.choose = null; S.msg = ''; update(); }
  function validate() {
    if (S.done || S.path[S.path.length - 1] !== S.P.t) return;
    stopTimer();
    S.elapsed = S.t0 ? Date.now() - S.t0 : 0;
    S.done = true;
    if (S.mode === 'daily') save('corr:' + NET_VERSION + ':' + S.key, { path: S.path, via: S.via, elapsed: S.elapsed });
    update();
    $('result').scrollIntoView({ block: 'nearest' });
  }

  function showResult() {
    var P = S.P, ev = evaluate(true), opt = P.opt, cost = ev.cost, diff = cost - opt;
    var pct = Math.round(diff / opt * 100);
    var verdict = diff === 0 ? 'Optimal' : pct <= 8 ? 'Excellent' : pct <= 20 ? 'Bien joué' : pct <= 40 ? 'Peut mieux faire' : 'Grand détour';
    $('pct').textContent = diff === 0 ? '0 %' : '+' + pct + ' %';
    $('verdict').textContent = verdict;
    $('detail').textContent = diff === 0
      ? 'Ton trajet dure ' + cost + ' min : aucun trajet ne fait mieux.'
      : 'Ton trajet dure ' + cost + ' min. Le meilleur dure ' + opt + ' min, soit ' + diff + ' min de moins.';
    var lesson = $('lesson');
    if (P.hopsMin < P.optEdges.length && P.trap > opt) {
      lesson.hidden = false;
      lesson.textContent = 'Passer par le moins d’étapes (' + P.hopsMin + ') coûte ' + P.trap + ' min. Le trajet le plus direct n’est pas le plus rapide : les attentes et les vitesses comptent. C’est ce que calcule l’algorithme de Dijkstra.';
    } else lesson.hidden = true;

    var sq = ev.pens.map(function (p) { return p <= 0 ? '🟩' : p <= 5 ? '🟨' : '🟥'; }).join('');
    var now = new Date();
    var head = S.mode === 'daily'
      ? 'Correspondance n°' + dayNo(now) + ' · ' + now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
      : 'Correspondance · entraînement';
    $('shareText').textContent = head + '\n🚇 ' + (diff === 0 ? 'Trajet optimal' : '+' + pct + ' % sur l’optimal') + ' · ⏱ ' + fmt(S.elapsed) + '\n' + sq + '\nFais mieux ?';
    $('again').textContent = S.mode === 'daily' ? 'Grille d’entraînement' : 'Nouvelle grille';
  }

  async function copy() {
    var el = $('shareText');
    try {
      await navigator.clipboard.writeText(el.textContent);
      $('copied').textContent = 'Copié.';
    } catch (e) {
      var r = document.createRange(); r.selectNodeContents(el);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      $('copied').textContent = 'Texte sélectionné : copiez-le à la main.';
    }
    setTimeout(function () { $('copied').textContent = ''; }, 2500);
  }

  svg.addEventListener('click', function (e) {
    var g = e.target.closest('.sta');
    if (g) tap(+g.dataset.id);
  });
  svg.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.sta');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tap(+g.dataset.id); }
  });
  $('undo').addEventListener('click', undo);
  $('reset').addEventListener('click', reset);
  $('validate').addEventListener('click', validate);
  $('copy').addEventListener('click', copy);
  $('again').addEventListener('click', function () { start('train'); window.scrollTo(0, 0); });
  $('m-daily').addEventListener('click', function () { if (S.mode !== 'daily') start('daily'); });
  $('m-train').addEventListener('click', function () { start('train'); });

  start('daily');
})();
</script>

</body></html>
